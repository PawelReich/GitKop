name: Build firmware

on:
  push:

jobs:
  build:
    name: Build
    runs-on: nix-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v4
        with:
          path: |
            /nix/store
            ~/.cache/nix
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-${{ runner.os }}-

      - name: Build ELF
        run: nix build

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Firmware
          path: 'result/*'
