name: Build firmware

on:
  push:

jobs:
  build:
    name: Build
    runs-on: nix-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build ELF
        run: nix build

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Firmware
          path: 'result/*'
